<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Bitcoin - 21M Supply</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:10px}
.card{background:#1c1c1c;border:1px solid #f7931a;border-radius:20px;padding:20px;margin:15px auto;max-width:420px}
.btc{font-size:38px;font-weight:bold;color:#f7931a}
.balance{font-size:36px;color:#00ff88;font-weight:bold;margin:10px 0}
button{width:100%;padding:16px;border-radius:30px;border:none;background:#f7931a;color:#fff;font-size:18px;font-weight:bold;margin-top:10px}
.btn2{background:#222;border:1px solid #444}
.info{color:#aaa;font-size:13px;margin-top:10px}
.wallet-box{font-size:11px;color:#f7931a;word-break:break-all;background:#111;padding:10px;border-radius:10px;margin-top:8px;border:1px solid #333}
</style>
</head>
<body>
<h2 style="color:#f7931a">🟠 New Bitcoin</h2>
<p>21M Supply - Mineable - No Liquidity - Fair Launch</p>

<div class="card">
<p>Total Supply: 21,000,000 NEWBTC</p>
<div class="btc" id="bal">0.00000000</div>
<p>Your Mined NEWBTC</p>
<button id="btn" onclick="mine()">START MINING ⛏️</button>
<p id="live" class="info"></p>
<p class="info">Rate: 0.05 NEWBTC / Hour - 100% FREE - No Gas Fee</p>
<button class="btn2" onclick="withdraw()">💸 WITHDRAW (Min 1.0 NEWBTC)</button>
</div>

<div class="card">
<p>💼 Treasury / Owner Wallet</p>
<div class="wallet-box">0xb1399926419a2769681Ac2E0c092aB3D11aCdB00</div>
<p id="userWal" style="margin-top:12px;color:#00ff88">Your Wallet: Loading...</p>
<p style="font-size:12px;color:#888;margin-top:15px">🔗 Your Referral Link:</p>
<div class="wallet-box" id="refLink" style="color:#fff"></div>
<button class="btn2" style="font-size:14px;padding:10px" onclick="copyRef()">Copy Referral Link</button>
</div>

<script>
let ownerWallet = "0xb1399926419a2769681Ac2E0c092aB3D11aCdB00";
let base = parseFloat(localStorage.getItem('newbtc_bal')||0);
let mining = localStorage.getItem('newbtc_mining')==='1';
let st = parseInt(localStorage.getItem('newbtc_st')||0);

if(!localStorage.getItem('newbtc_wallet')){
  localStorage.setItem('newbtc_wallet', ownerWallet);
}
let myWallet = localStorage.getItem('newbtc_wallet');
document.getElementById('userWal').innerText = "Your Wallet: " + myWallet.slice(0,6) + "..." + myWallet.slice(-4) + " ✅";

let ref = window.location.origin + window.location.pathname + "?ref=" + myWallet;
document.getElementById('refLink').innerText = ref;

function copyRef(){ navigator.clipboard.writeText(ref); alert("Referral Copied!"); }

function withdraw(){
 let bal = parseFloat(document.getElementById('bal').innerText);
 if(bal < 1){ alert("Minimum 1 NEWBTC needed! Keep mining. Your balance: " + bal.toFixed(8)); return; }
 alert("Withdraw Request Sent!\nAmount: "+bal.toFixed(8)+" NEWBTC\nTo: "+myWallet+"\n\nOwner will send after mainnet launch!");
}

function mine(){
 if(mining){
  let earn=(Date.now()-st)/3600000*0.05;
  base+=earn;
  localStorage.setItem('newbtc_bal',base);
  localStorage.setItem('newbtc_mining','0');
  mining=false;
 }else{
  st=Date.now();localStorage.setItem('newbtc_st',st);localStorage.setItem('newbtc_mining','1');mining=true;
 }
}
function upd(){
 let d=base;
 if(mining){
  let e=(Date.now()-st)/3600000*0.05; d+=e;
  document.getElementById('btn').innerText="STOP & CLAIM ⏹️";
  document.getElementById('live').innerText="Mining Live: +"+e.toFixed(8);
 }else{
  document.getElementById('btn').innerText="START MINING ⛏️";
  document.getElementById('live').innerText="Paused - Click to resume";
 }
 document.getElementById('bal').innerText=d.toFixed(8);
}
setInterval(upd,500);upd();
</script>
</body>
</html>
