<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>

        .wrapper { width: 100%; max-width: 700px; background: #1e293b; border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
        header { text-align: center; margin-bottom: 25px; }
        header h1 { color: #38bdf8; font-size: 26px; margin-bottom: 8px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #cbd5e1; }
        input[type="text"] { width: 100%; padding: 14px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 16px; outline: none; font-family: monospace; }
        input[type="text"]:focus { border-color: #38bdf8; }
        .btn { width: 100%; background: #10b981; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #059669; }
        .status-box { text-align: center; margin: 15px 0; font-size: 14px; color: #f59e0b; font-weight: bold; }
        .output-panel { display: none; margin-top: 25px; background: #0f172a; border-radius: 10px; padding: 20px; border: 1px solid #334155; }
        .data-row { margin-bottom: 18px; }
        .data-label { font-size: 12px; text-transform: uppercase; color: #64748b; font-weight: bold; margin-bottom: 4px; }
        .data-value { font-family: monospace; font-size: 14px; color: #e2e8f0; word-break: break-all; background: #1e293b; padding: 10px; border-radius: 6px; border: 1px solid #334155; }
        .highlight-addr { color: #38bdf8 !important; font-weight: bold; }
        .highlight-key { color: #f43f5e !important; }
        .match-word { color: #e11d48; font-weight: bold; background: #4c0519; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1>Custom Address (Vanity) Wallet Generator</h1>
        <p>Apni marzi ka address characters dhoondein</p>
    </header>

    <div class="input-group">
        <label>Apne Address ki Shuruat ke Characters Likhein (e.g., 1abc, 1jack, 1777):</label>
        <input type="text" id="prefixInput" placeholder="Must start with 1... (Keep it short for speed!)" value="1ab">
        <small style="color: #94a3b8; display: block; margin-top: 5px;">Tip: Sirf 2-3 characters likhein (jaise 1ab), zyada bade words dhoondne mein browser bohot zyada time lega.</small>
    </div>

    <button class="btn" id="startBtn" onclick="startVanitySearch()">Start Mining Address</button>

    <div id="statusUpdate" class="status-box"></div>

    <!-- Output Panel -->
    <div id="outputPanel" class="output-panel">
        <div class="data-row">
            <div class="data-label">🔑 Generated Passphrase Found (Aapka Secret Word)</div>
            <div id="foundPassphrase" class="data-value" style="color: #10b981; font-weight: bold;"></div>
        </div>

        <div class="data-row">
            <div class="data-label">Private Key (Hex)</div>
            <div id="seedHash" class="data-value highlight-key"></div>
        </div>

        <div class="data-row">
            <div class="data-label">🎯 Custom Bitcoin Address Match</div>
            <div id="btcAddress" class="data-value highlight-addr"></div>
        </div>
    </div>
</div>

<script>
// Base58 encoder for Bitcoin layout
const b58digits = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function base58CheckEncode(version, hexData) {
    let bytes = [];
    for (let c = 0; c < hexData.length; c += 2) bytes.push(parseInt(hexData.substr(c, 2), 16));
    let source = [];
    for (let c = 0; c < version.length; c += 2) source.push(parseInt(version.substr(c, 2), 16));
    source = source.concat(bytes);
    
    let hash1 = CryptoJS.SHA256(CryptoJS.enc.Hex.parse(hexData));
    let hash2 = CryptoJS.SHA256(hash1);
    let checksum = hash2.toString(CryptoJS.enc.Hex).substring(0, 8);
    
    let fullHex = version + hexData + checksum;
    let x = BigInt('0x' + fullHex);
    let res = [];
    while (x > 0n) {
        let rem = x % 58n;
        x = x / 58n;
        res.push(b58digits[Number(rem)]);
    }
    return res.reverse().join("");
}

let searching = false;

function startVanitySearch() {
    if (searching) {
        searching = false;
        document.getElementById('startBtn').innerText = "Start Mining Address";
        document.getElementById('startBtn').style.background = "#10b981";
        return;
    }

    const prefix = document.getElementById('prefixInput').value.trim();
    if (!prefix.startsWith('1')) {
        alert("Bitcoin legacy address hamesha '1' se shuru hota hai. Please '1' se start karein!");
        return;
    }

    searching = true;
    document.getElementById('startBtn').innerText = " Mining";
    document.getElementById('startBtn').style.background = "#ef4444";
    document.getElementById('outputPanel').style.display = 'none';
    
    let attempts = 0;
    
    function loop() {
        if (!searching) return;
        
        // Loop runs in batches so the browser doesn't freeze
        for (let i = 0; i < 200000000000000000000000000000000000000000000000000; i++) {
            attempts++;
            
            // 1. Random secret string/passphrase generate karna
            let randomPassphrase = "BrainWallet_" + Math.random().toString(36).substring(2, 10) + "_" + attempts;
            
            // 2. Hash compute karna
            let hash = CryptoJS.SHA256(randomPassphrase).toString(CryptoJS.enc.Hex);
            
            // 3. Address format banana
            let generatedAddress = base58CheckEncode("00", hash.substring(0, 40));
            
            // 4. Check karna kya yeh aapke target characters se match karta hai
            if (generatedAddress.startsWith(prefix)) {
                searching = false;
                document.getElementById('startBtn').innerText = "Start Mining Address";
                document.getElementById('startBtn').style.background = "#10b981";
                
                // Show Result
                document.getElementById('foundPassphrase').innerText = randomPassphrase;
                document.getElementById('seedHash').innerText = hash;
                document.getElementById('btcAddress').innerText = generatedAddress;
                document.getElementById('outputPanel').style.display = 'block';
        size_t ADDRESS_LENGTH_NC = 40;
size_t PRIVKEY_WIF_LENGTH_NC = 70;

// Calculate the secp256k1 public key from the private key
void pubkey_from_privkey(unsigned char privkey[SHA256_DIGEST_LENGTH],  unsigned char pubkey[PUBKEY_65_LENGTH])
{
         ecdsa_get_public_key65(&secp256k1, (uint8_t*) privkey,
                            (uint8_t*) pubkey);
}

// Generate address from pubkey
void address_from_pubkey(const unsigned char pubkey[PUBKEY_65_LENGTH], unsigned char version_prefix, unsigned char address[ADDRESS_LENGTH])
{
        // First, "double hash" the public key
        unsigned char round_1[SHA256_DIGEST_LENGTH];
        unsigned char round_2[RIPEMD160_DIGEST_LENGTH];

        sha256_Raw((uint8_t*) pubkey, PUBKEY_65_LENGTH, (uint8_t*) round_1);
        ripemd160((uint8_t*) round_1, SHA256_DIGEST_LENGTH, (uint8_t*) round_2);

        // Add the version specifier
        unsigned char raw_address_nocheck[RAW_ADDRESS_NOCHECK_LENGTH];
        raw_address_nocheck[0] = version_prefix;
        memcpy(raw_address_nocheck + 1, round_2, RIPEMD160_DIGEST_LENGTH);

        // Generate a checksum
        unsigned char check_round_1[SHA256_DIGEST_LENGTH];
        unsigned char check_round_2[SHA256_DIGEST_LENGTH];
        unsigned char checksum[CHECKSUM_LENGTH];

        sha256_Raw((uint8_t*) raw_address_nocheck, RAW_ADDRESS_NOCHECK_LENGTH, check_round_1);
        sha256_Raw((uint8_t*) check_round_1, SHA256_DIGEST_LENGTH, check_round_2);
        memcpy(checksum, check_round_2, CHECKSUM_LENGTH);


        // Finalize the raw address
        // 1 byte for the version string
        // 20 bytes for the pubkey hash
        // 4 bytes for the checksum
        unsigned char raw_address_check[RAW_ADDRESS_CHECK_LENGTH];
        memcpy(raw_address_check, raw_address_nocheck, RAW_ADDRESS_NOCHECK_LENGTH);
        memcpy(raw_address_check + RAW_ADDRESS_NOCHECK_LENGTH, checksum, CHECKSUM_LENGTH);

        // Base58 encode
        b58enc((char*) address, &ADDRESS_LENGTH_NC, raw_address_check, RAW_ADDRESS_CHECK_LENGTH);
}

void privkey_wif_from_raw(unsigned char* privkey_raw, unsigned char version_prefix, unsigned char* privkey)
{

        // Add the version specifierd
        unsigned char raw_privkey_nocheck[RAW_PRIVKEY_NOCHECK_LENGTH];
        raw_privkey_nocheck[0] = version_prefix;
        memcpy(raw_privkey_nocheck + 1, privkey_raw, SHA256_DIGEST_LENGTH);

        // Generate a checksum
        unsigned char check_round_1[SHA256_DIGEST_LENGTH];
        unsigned char check_round_2[SHA256_DIGEST_LENGTH];
        unsigned char checksum[CHECKSUM_LENGTH];

        sha256_Raw((uint8_t*) raw_privkey_nocheck, RAW_PRIVKEY_NOCHECK_LENGTH, check_round_1);
        sha256_Raw((uint8_t*) check_round_1, SHA256_DIGEST_LENGTH, check_round_2);
        memcpy(checksum, check_round_2, CHECKSUM_LENGTH);


        // Finalize the raw WIF format privkey
        // 1 byte for the version string - 0x80 for mainneti BTC/BCH
        // 32 bytes for the raw private key data
        // 4 bytes for the checksum
        unsigned char raw_privkey_check[RAW_PRIVKEY_CHECK_LENGTH];
        memcpy(raw_privkey_check, raw_privkey_nocheck, RAW_PRIVKEY_NOCHECK_LENGTH);
        memcpy(raw_privkey_check + RAW_PRIVKEY_NOCHECK_LENGTH, checksum, CHECKSUM_LENGTH);

        // Base58 encode
        b58enc((char*) privkey, &PRIVKEY_WIF_LENGTH_NC, raw_privkey_check, RAW_PRIVKEY_CHECK_LENGTH);
}

{

        unsigned char pubkey[PUBKEY_65_LENGTH];

        }
